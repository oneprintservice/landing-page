<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin Login - KSP Manager</title><link rel="stylesheet" href="../assets/css/lapangan.css"></head><body><main class="ksp-shell" style="min-height:100vh;display:grid;place-items:center"><section class="ksp-card" style="width:min(420px,100%);padding:22px"><div style="text-align:center;margin-bottom:18px"><div class="brand-mark" style="margin:auto">MKS</div><h1 style="margin:10px 0 3px">Superadmin</h1><p style="color:#64748b;margin:0">KSP Manager — Area Pemilik</p></div><form id="loginForm" class="ksp-grid"><div class="ksp-field full"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="ksp-field full"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="ksp-field full"><button class="ksp-btn ksp-btn-primary" type="submit">Masuk sebagai Superadmin</button></div></form><p id="status" style="font-size:12px;color:#64748b;text-align:center;margin:14px 0 0"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/common.js"></script><script>
const form=document.getElementById('loginForm'), statusEl=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='Memeriksa akun...';
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){statusEl.textContent='Login gagal: '+error.message;return;}
 const {data:role,error:roleError}=await supabaseClient.rpc('ksp_current_role');
 if(roleError || role!=='superadmin'){await supabaseClient.auth.signOut();statusEl.textContent=roleError?'Gagal membaca role: '+roleError.message:'Akun ini bukan Superadmin.';return;}
 statusEl.textContent='Login Superadmin berhasil.';location.href='dashboard.html';
});
</script></body></html>
