<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Data Nasabah - KSP Manager</title>
<style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: inherit;
            background: #f1f5f9;
            color: #172554;
        }

        .header {
            background: #14533e;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0 0 5px;
        }

        .header p {
            margin: 0;
            opacity: .9;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .topbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-add {
            background: #16a34a;
            color: white;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
            margin-bottom: 20px;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn-search {
            background: #14533e;
            color: white;
        }

        .table-box {
            background: white;
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #dc2626;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .search-row {
                flex-direction: column;
            }

            .btn-search {
                width: 100%;
            }
        }
    </style>
<link href="../assets/css/lapangan.css" rel="stylesheet"/>
<link href="../assets/css/admin.css" rel="stylesheet"/>
<link href="../assets/css/mks-theme.css?v=27" rel="stylesheet"/><link href="../assets/img/favicon.png" rel="icon" type="image/png"/><meta content="#14533e" name="theme-color"/></head>
<body>
<header class="header"><div class="mks-admin-header-logo"><img alt="Logo KSP Maha Karya Saputra" src="../assets/img/maha-karya-saputra.webp"/></div><div class="mks-admin-header-text">
<h1>Data Nasabah</h1>
<p>
            KSP Manager
        </p>
</div></header>
<main class="container">
<p class="page-intro">Kelola data nasabah, cari profil, dan buka detail riwayat dengan cepat.</p>
<div class="topbar">
<a class="btn btn-back" href="../dashboard.html">
                ⌂ Dashboard
            </a>
<a class="btn btn-add" href="../lapangan/tambah-nasabah.html">
                + Tambah Nasabah
            </a>
</div>
<section class="search-box">
<div class="search-row">
<input id="searchInput" placeholder="Cari nomor anggota, NIK, atau nama..." type="text"/>
<button class="btn btn-search" id="searchButton">
                    🔍 Cari
                </button>
</div>
</section>
<section class="table-box">
<table>
<thead>
<tr>
<th>Nama</th>
<th>No. Anggota</th>
<th>NIK</th>
<th>Alamat</th>
<th>No. HP</th>
<th>Status</th>
<th>Credit Score</th>
</tr>
</thead>
<tbody id="nasabahTable">
<tr>
<td class="loading" colspan="6">
                            Memuat data nasabah...
                        </td>
</tr>
</tbody>
</table>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/common.js"></script>
<script src="nasabah.js"></script>
<nav aria-label="Navigasi admin" class="ksp-bottom">

<a href="pinjaman.html"><span class="ksp-nav-icon">💰</span><span>Pinjaman</span></a>
<a href="ledger.html"><span class="ksp-nav-icon">📒</span><span>Ledger</span></a>
</nav>
</body>
</html>
