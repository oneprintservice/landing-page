<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Pengajuan Kredit - KSP Manager</title><link href="../assets/css/lapangan.css" rel="stylesheet"/><link href="../assets/css/mks-theme.css?v=27" rel="stylesheet"/><link href="../assets/img/favicon.png" rel="icon" type="image/png"/><meta content="#14533e" name="theme-color"/></head><body>
<header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-mark"><img alt="Logo KSP Maha Karya Saputra" src="../assets/img/maha-karya-saputra.webp"/></div><div><h1 class="brand-title">KSP Manager</h1><p class="brand-subtitle">Administrator</p></div></div></div></header>
<main class="ksp-shell"><div class="ksp-actions"><a class="ksp-btn ksp-btn-light" href="dashboard.html">⌂ Dashboard</a><a class="ksp-btn ksp-btn-success" href="pinjaman.html">💰 Pinjaman</a></div>
<section class="ksp-card"><h3>Pilih Nasabah</h3><div class="ksp-search"><input id="customerSearch" placeholder="Nomor anggota, nama, atau NIK"/><button class="ksp-btn ksp-btn-primary" id="customerSearchBtn">Cari</button></div><div id="customerResults" style="margin-top:10px"></div><div id="selected" style="margin-top:10px"></div></section>
<section class="ksp-card"><h3>Detail Pengajuan</h3><form class="ksp-grid" id="form"><div class="ksp-field"><label>Jumlah Pengajuan (ribu)</label><input id="jumlah" inputmode="numeric" placeholder="1200" required=""/></div><div class="ksp-field"><label>Tenor</label><input id="tenor" max="60" min="1" required="" type="number"/></div><div class="ksp-field full"><label>Model Jatuh Tempo</label><select id="model"><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div><div class="ksp-field full"><label>Tujuan</label><input id="tujuan" required=""/></div><div class="ksp-field full"><label>Catatan</label><textarea id="catatan"></textarea></div><div class="ksp-field full"><button class="ksp-btn ksp-btn-success" type="submit">✓ Ajukan Kredit</button></div></form></section>
<section class="ksp-card"><h3>Daftar Pengajuan</h3><div class="ksp-search"><input id="filter" placeholder="Cari nomor anggota, nama, atau NIK"/><button class="ksp-btn ksp-btn-primary" id="filterBtn">Cari</button></div><div class="ksp-table-wrap" style="margin-top:10px"><table class="ksp-table"><thead><tr><th>Tanggal</th><th>No. Anggota</th><th>Nasabah</th><th>NIK</th><th>Jumlah</th><th>Tenor</th><th>JT</th><th>Status Nasabah</th><th>Score</th><th>Status Pengajuan</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><nav class="ksp-bottom"><a href="dashboard.html"><span class="ksp-nav-icon">⌂</span><span>Dashboard</span></a><a href="nasabah.html"><span class="ksp-nav-icon">👥</span><span>Nasabah</span></a><a class="active" href="pengajuan.html"><span class="ksp-nav-icon">📋</span><span>Pengajuan</span></a><a href="pinjaman.html"><span class="ksp-nav-icon">💰</span><span>Pinjaman</span></a><a href="ledger.html"><span class="ksp-nav-icon">📒</span><span>Ledger</span></a></nav>
