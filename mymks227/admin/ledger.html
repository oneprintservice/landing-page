<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Ledger Harian - KSP Manager</title><link href="../assets/css/lapangan.css" rel="stylesheet"/><link href="../assets/css/mks-theme.css?v=27" rel="stylesheet"/><link href="../assets/img/favicon.png" rel="icon" type="image/png"/><meta content="#14533e" name="theme-color"/></head><body>
<header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-mark"><img alt="Logo KSP Maha Karya Saputra" src="../assets/img/maha-karya-saputra.webp"/></div><div><h1 class="brand-title">KSP Manager</h1><p class="brand-subtitle">Ledger Transaksi Harian</p></div></div></div></header>
<main class="ksp-shell"><div class="ksp-actions"><a class="ksp-btn ksp-btn-light" href="dashboard.html">⌂ Dashboard</a><a class="ksp-btn ksp-btn-primary" href="pinjaman.html">💰 Pinjaman</a></div>
<section class="ksp-card"><h3>Input Ledger</h3><form class="ksp-grid" id="ledgerForm"><div class="ksp-field"><label>Tanggal</label><input id="tanggal" required="" type="date"/></div><div class="ksp-field"><label>Nomor Anggota</label><div class="ksp-search"><input id="nomorAnggota" inputmode="numeric" maxlength="5" placeholder="1–5 digit" required=""/><button class="ksp-btn ksp-btn-primary" id="cariNasabah" type="button">Cari</button></div></div><div class="ksp-field"><label>Nama</label><input class="ksp-readonly" id="nama" placeholder="Otomatis" readonly=""/></div><div class="ksp-field"><label>Alamat</label><input class="ksp-readonly" id="alamat" placeholder="Otomatis" readonly=""/></div><div class="ksp-field"><label>Drop Lama (ribu)</label><input id="dropLama" inputmode="numeric" placeholder="120"/></div><div class="ksp-field"><label>Drop Baru (ribu)</label><input id="dropBaru" inputmode="numeric" placeholder="1250"/></div><div class="ksp-field"><label>BHT (ribu)</label><input id="bht" inputmode="numeric" placeholder="0"/></div><div class="ksp-field"><label>Materai (ribu)</label><input id="materai" inputmode="numeric" placeholder="0"/></div><div class="ksp-field full"><button class="ksp-btn ksp-btn-success" type="submit">💾 Simpan Ledger</button></div></form></section>
<section class="ksp-card"><h3>Transaksi</h3><div class="ksp-field"><label>Filter Tanggal</label><input id="filterTanggal" type="date"/></div><div class="ksp-table-wrap" style="margin-top:10px"><table class="ksp-table"><thead><tr><th>No</th><th>Tanggal</th><th>No. Anggota</th><th>Nama</th><th>Alamat</th><th>Drop Lama</th><th>Drop Baru</th><th>BHT</th><th>Materai</th><th>Staf</th><th>Aksi</th></tr></thead><tbody id="txBody"></tbody></table></div></section>
<section class="ksp-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">Rekap</h3><div class="ksp-field" style="min-width:190px"><label>Filter Staf Lapangan</label><select id="filterStaf"><option value="">Semua staf</option></select></div></div><div class="ksp-stat-grid" style="margin-top:12px"><div class="ksp-stat"><small>Total Drop Lama</small><strong id="totalLama">Rp 0</strong></div><div class="ksp-stat"><small>Total Drop Baru</small><strong id="totalBaru">Rp 0</strong></div><div class="ksp-stat"><small>Total Jumlah</small><strong id="totalJumlah">Rp 0</strong></div></div></section></main>
<nav class="ksp-bottom"><a href="dashboard.html"><span class="ksp-nav-icon">⌂</span><span>Dashboard</span></a><a href="nasabah.html"><span class="ksp-nav-icon">👥</span><span>Nasabah</span></a><a href="pengajuan.html"><span class="ksp-nav-icon">📋</span><span>Pengajuan</span></a><a href="pinjaman.html"><span class="ksp-nav-icon">💰</span><span>Pinjaman</span></a><a class="active" href="ledger.html"><span class="ksp-nav-icon">📒</span><span>Ledger</span></a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/common.js"></script>
<script src="ledger.js"></script></body></html>
