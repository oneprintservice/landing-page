<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin - KSP Manager</title><link rel="stylesheet" href="../assets/css/lapangan.css"></head><body><header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-mark">MKS</div><div><h1 class="brand-title">KSP Manager</h1><p class="brand-subtitle">Superadmin</p></div></div></div></header><main class="ksp-shell"><section class="ksp-card"><div class="page-kicker">🔐 SUPERADMIN</div><h2 class="page-title">Area Pemilik</h2><p class="page-desc">Fondasi otorisasi Superadmin sudah aktif.</p><div id="info" class="ksp-card" style="margin-top:14px"></div><button id="logout" class="ksp-btn ksp-btn-danger" style="width:100%;margin-top:14px">🚪 Keluar</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/common.js"></script><script>
(async()=>{const info=document.getElementById('info');const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='login.html';return;}const {data:role,error}=await supabaseClient.rpc('ksp_current_role');if(error||role!=='superadmin'){await supabaseClient.auth.signOut();location.href='login.html';return;}info.innerHTML='<strong>Login:</strong> '+kspEscape(session.user.email)+'<br><strong>Role:</strong> '+kspEscape(role)+'<br><br><span style="color:#64748b">Belum ada operasi delete/reset/backup/restore pada tahap ini.</span>';document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='login.html';};})();
</script></body></html>
