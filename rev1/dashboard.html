<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard OnePrint Service - Ponorogo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="app-ui">
        <header class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-lg">
            <div class="font-bold text-xl flex items-center italic">
                <i class="fas fa-tools mr-3 text-yellow-400"></i> OnePrint <span class="text-blue-400 ml-1">Repair Service</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex flex-col text-right">
                    <span id="user-display" class="text-[10px] text-cyan-300 font-mono"></span>
                    <span id="idle-timer" class="text-[9px] text-gray-400 italic">Sesi Aktif</span>
                </div>
                <button id="btn-logout" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center">
                    <i class="fas fa-power-off mr-2"></i> LOGOUT
                </button>
            </div>
        </header>

        <main class="p-4 grid grid-cols-1 lg:grid-cols-3 gap-3 items-start">
            <div class="lg:col-span-2 space-y-4">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

                    <div onclick="lihatServisAktif()"
                         class="bg-white rounded-xl shadow-sm p-4 border text-center cursor-pointer hover:bg-blue-50">
                        <div class="flex items-center justify-center gap-1">

                            <div class="text-xs text-gray-500">
                                Servis Aktif
                            </div>
                        
                            <div id="badge-servis-baru"
                                 class="hidden bg-red-600 text-white text-[10px] font-bold min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center">
                                0
                            </div>
                        
                        </div>
                        <div id="stat-aktif"
                            class="text-2xl font-bold text-blue-600">
                            0
                        </div>
                    </div>

                    <div onclick="lihatMenungguSparepart()"
                         class="bg-white rounded-xl shadow-sm p-4 border text-center cursor-pointer hover:bg-amber-50">
                        <div class="text-xs text-gray-500">Menunggu Sparepart</div>
                        <div id="stat-sparepart"
                            class="text-2xl font-bold text-amber-600">
                            0
                        </div>
                    </div>

                    <div onclick="lihatSelesai()"
                         class="bg-white rounded-xl shadow-sm p-4 border text-center cursor-pointer hover:bg-green-50">
                        <div class="text-xs text-gray-500">Selesai</div>
                        <div id="stat-selesai"
                            class="text-2xl font-bold text-green-600">
                            0
                        </div>
                    </div>

                    <div onclick="lihatTotalServis()"
                         class="bg-white rounded-xl shadow-sm p-4 border text-center cursor-pointer hover:bg-purple-50">
                        <div class="text-xs text-gray-500">Total Servis</div>
                        <div id="stat-total"
                            class="text-2xl font-bold text-purple-600">
                            0
                        </div>
                    </div>

                </div>
                <div class="bg-white rounded-xl shadow-sm p-5 border">
                    <div class="flex gap-2">
                        <div class="relative flex-grow">
                            <i class="fas fa-barcode absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" id="barcode-input" placeholder="Scan Serial Number (Enter)..." class="w-full pl-10 pr-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase font-mono">
                        </div>
                        <button id="btn-scan" class="bg-slate-700 text-white px-4 rounded-lg hover:bg-slate-800"><i class="fas fa-camera"></i></button>
                    </div>
                    <div id="reader" class="w-full hidden mt-4 border-2 border-dashed border-gray-300 rounded-lg overflow-hidden"></div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-5 border">
                    <h3 class="font-bold text-gray-700 mb-3 text-sm uppercase"><i class="fas fa-list-ul mr-2"></i> Item Biaya</h3>
                    <div class="flex border-b mb-4 text-xs font-bold">
                        <button onclick="setTab('jasa')" id="tab-jasa" class="px-4 py-2 border-b-2 border-blue-600 text-blue-600">JASA SERVIS</button>
                        <button onclick="setTab('sparepart')" id="tab-sparepart" class="px-4 py-2 text-gray-500">SPAREPART / TINTA</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-stretch">
                        <div class="sm:col-span-7 relative">
                            <input type="text"
                                id="input-item-nama"
                                placeholder="Cari barang / jasa..."
                                autocomplete="off"
                                class="w-full h-12 p-2 border rounded bg-gray-50 text-sm">

                            <div id="hasil-pencarian"
                                class="absolute z-50 bg-white border rounded shadow w-full hidden max-h-60 overflow-y-auto">
                            </div>
                        </div>
                        <input type="number" id="input-item-harga" placeholder="Harga" class="sm:col-span-3 h-12 p-2 border rounded bg-gray-50 text-sm">
                        <button id="btn-tambah-item"
                                title="Tambah Manual"
                                class="
                                sm:col-span-2
                                bg-slate-700
                                text-white
                                rounded-xl
                                text-sm
                                font-bold
                                h-12 flex items-center justify-center
                                active:scale-95
                                shadow">
                            TAMBAH
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-5 border flex flex-col h-fit lg:sticky lg:top-4">
                <h2 class="font-bold text-gray-800 mb-4 border-b pb-2 text-sm">DATA WORK ORDER</h2>
                <div class="mb-3 flex gap-2">
                
                    <input
                        type="text"
                        id="cari-servis"
                        placeholder="Cari No TT / Invoice / Barcode"
                        class="flex-1 p-2 border rounded text-sm">
                
                    <button
                        onclick="cariServis()"
                        class="bg-blue-600 text-white px-3 rounded text-sm font-bold">
                        CARI
                    </button>
                
                </div>
                
                <div id="mode-edit"
                     class="hidden mb-3 bg-green-100 border border-green-400 text-green-800 text-xs p-2 rounded">
                </div>
                
                <button
                    id="btn-update-servis"
                    onclick="updateServisAktif()"
                    class="hidden w-full mb-2 bg-green-600 text-white py-2 rounded text-xs font-bold">
                    UPDATE SERVIS
                </button>
                
                <button
                    id="btn-hapus-servis"
                    onclick="hapusServisAktif()"
                    class="hidden w-full mb-2 bg-red-600 text-white py-2 rounded text-xs font-bold">
                    HAPUS SERVIS
                </button>

                <button
                    id="btn-reprint-nota"
                    onclick="reprintNota()"
                    class="hidden w-full mb-2 bg-blue-600 text-white py-2 rounded text-xs font-bold">
                    REPRINT NOTA
                </button>
                
                <button
                    id="btn-batal-edit"
                    onclick="batalEditServis()"
                    class="hidden w-full mb-3 bg-gray-500 text-white py-2 rounded text-xs font-bold">
                    KELUAR MODE EDIT
                </button>
                <div class="mb-3">
                    <label class="text-xs font-bold text-gray-600">STATUS SERVIS</label>
                    <select id="status-servis" class="w-full p-2 border rounded text-sm">
                        <option value="MASUK">MASUK</option>
                        <option value="DIAGNOSA">DIAGNOSA</option>
                        <option value="MENUNGGU SPAREPART">MENUNGGU SPAREPART</option>
                        <option value="DIKERJAKAN">DIKERJAKAN</option>
                        <option value="SELESAI">SELESAI</option>
                        <option value="CANCEL">CANCEL</option>
                        <option value="DIAMBIL">DIAMBIL</option>
                    </select>
                </div>

                <textarea id="keterangan-servis"
                    placeholder="Catatan teknisi / keterangan..."
                    class="w-full p-2 border rounded text-sm mb-3"
                    rows="3"></textarea>
                <div class="space-y-2 mb-4">
                    <input type="text" id="input-nama" placeholder="Nama Pelanggan" class="w-full p-2 text-sm border rounded uppercase">
                    <input type="text" id="input-telp" placeholder="No. HP" class="w-full p-2 text-sm border rounded">
                    <input type="text" id="input-merk" placeholder="Merk/Model Perangkat" class="w-full p-2 text-sm border rounded uppercase">
                    <input type="text" id="input-kelengkapan" placeholder="Kelengkapan" class="w-full p-2 text-sm border rounded uppercase">
                    <textarea id="input-keluhan" placeholder="Keluhan Kerusakan" class="w-full p-2 text-sm border rounded h-16 uppercase"></textarea>
                </div>

                <div id="list-transaksi" class="border rounded p-2 bg-gray-50 text-[10px] min-h-[100px] mb-4">
                    <div class="text-center text-gray-400 mt-5 italic">Belum ada item biaya.</div>
                </div>

                <div class="flex justify-between font-bold text-blue-700 mb-4 px-1">
                    <span>TOTAL</span>
                    <span id="text-total">Rp 0</span>
                </div>

                <div class="grid grid-cols-1 gap-2 mb-2">
                    <button
                        onclick="cetakDokumen('terima')"
                        class="bg-amber-500 text-white h-12 rounded-xl font-bold text-sm flex items-center justify-center">
                        📄 CETAK TANDA TERIMA
                    </button>
                    <button
                        onclick="cetakDokumen('nota')"
                        class="bg-emerald-600 text-white h-12 rounded-xl font-bold text-sm flex items-center justify-center">
                        🖨 CETAK NOTA A5 (INVOICE)
                    </button>
                </div>
                <button
                    onclick="resetFormServis()"
                    class="w-full bg-red-600 text-white h-12 rounded-xl font-bold text-sm">
                    RESET FORM
                </button>
            </div>
                <div class="bg-white rounded-xl shadow-sm p-5 border -mt-2 lg:-mt-8 lg:col-span-2">
                    <h2 class="font-bold text-gray-800 mb-4 border-b pb-2 text-sm">
                        INVENTORI CEPAT
                    </h2>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div><input type="text"
                        id="inv-nama"
                        placeholder="Nama Barang"
                        class="w-full p-2 text-sm border rounded mb-2">

                    <select id="inv-kategori"
                            class="w-full p-2 text-sm border rounded mb-2">
                        <option value="sparepart">Sparepart</option>
                        <option value="tinta">Tinta</option>
                        <option value="lisensi">Lisensi / Resetkey</option>
                        <option value="jasa">Jasa</option>
                    </select>

                    <input type="number"
                        id="inv-beli"
                        placeholder="Harga Beli"
                        class="w-full p-2 text-sm border rounded mb-2">

                    <input type="number"
                        id="inv-jual"
                        placeholder="Harga Jual"
                        class="w-full p-2 text-sm border rounded mb-2">

                    <select id="inv-satuan"
                            class="w-full p-2 text-sm border rounded mb-2">
                        <option value="pcs">pcs</option>
                        <option value="ml">ml</option>
                        <option value="gram">gram</option>
                        <option value="kuota">kuota</option>
                    </select>

                    <input type="number"
                        id="inv-stok"
                        placeholder="Stok"
                        class="w-full p-2 text-sm border rounded mb-2">

                    <button id="btn-simpan-inventori"
                            class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg">
                        SIMPAN BARANG
                    </button>

                    </div><div><hr class="my-2 lg:hidden">

                    <h2 class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm">
                        DAFTAR INVENTORI
                    </h2>

                    <div id="inventori-list"
                        class="max-h-96 overflow-y-auto text-xs">
                        <div class="text-gray-400 italic">
                            Memuat inventori...
                        </div>
                    </div></div>
                </div>
        </main>
    </div>

    <div id="modal-statistik"
         class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    
        <div class="bg-white rounded-xl shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col">
    
            <div class="flex justify-between items-center p-4 border-b">
    
                <h2 id="modal-judul"
                    class="font-bold text-lg">
                    Statistik
                </h2>
    
                <button
                    onclick="tutupModalStatistik()"
                    class="text-red-600 font-bold text-xl">
                    ×
                </button>
    
            </div>
    
            <div id="modal-isi"
                 class="p-4 overflow-y-auto text-sm">
    
            </div>
    
        </div>
    
    </div>
    
    <div id="print-container" style="display: none;"></div>

    <script src="js/app.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/print.js"></script>
    <script src="js/inventori.js"></script>
    
</body>
</html>
