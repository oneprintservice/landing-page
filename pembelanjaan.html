<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembelanjaan - OnePrint</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="css/purchasing.css">
<link rel="stylesheet" href="css/app-shell.css">
</head>
<body class="bg-gray-100 min-h-screen">
<header class="op-app-header no-print">
  <button id="mobile-menu-toggle" class="op-icon-btn mobile-only" aria-label="Buka menu"><i class="fas fa-bars"></i></button>
  <div class="op-app-brand"><span class="op-app-logo"><i class="fas fa-screwdriver-wrench"></i></span><div><strong>OnePrint</strong><small>Service Management</small></div></div>
  <div class="flex items-center gap-4"><div class="hidden sm:flex flex-col text-right"><span id="user-display" class="text-[10px] text-cyan-300 font-mono"></span><span id="idle-timer" class="text-[9px] text-gray-400 italic">Sesi Aktif</span></div><button class="op-icon-btn" title="Notifikasi"><i class="far fa-bell"></i></button><button id="btn-logout" class="op-logout"><i class="fas fa-power-off"></i><span>Keluar</span></button></div>
</header>
<nav class="oneprint-nav no-print" id="app-sidebar" aria-label="Navigasi utama">
  <div class="op-sidebar-head"><span class="op-sidebar-caption">WORKSPACE</span></div>
  <div class="oneprint-nav-inner"><a class="oneprint-nav-item" href="dashboard.html"><i class="fas fa-gauge-high"></i><span>Dashboard</span></a><a class="oneprint-nav-item" href="service.html"><i class="fas fa-screwdriver-wrench"></i><span>Service</span></a><a class="oneprint-nav-item" href="inventori.html"><i class="fas fa-boxes-stacked"></i><span>Stok</span></a><a class="oneprint-nav-item active" href="pembelanjaan.html"><i class="fas fa-cart-shopping"></i><span>Belanja</span></a><a class="oneprint-nav-item" href="scanner.html"><i class="fas fa-qrcode"></i><span>Scanner</span></a><a class="oneprint-nav-item" href="pln.html"><i class="fas fa-bolt"></i><span>PLN</span></a><a class="oneprint-nav-item" href="internet.html"><i class="fas fa-wifi"></i><span>Internet</span></a><a class="oneprint-nav-item" href="tracking.html"><i class="fas fa-location-dot"></i><span>Tracking</span></a></div>
  <div class="op-sidebar-foot"><div><i class="fas fa-shield-halved"></i><span>Sistem aktif</span></div></div>
</nav>
<div class="op-mobile-backdrop" id="mobile-menu-backdrop"></div>
<div class="op-shell-content">

<main class="p-4 pb-10"><div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-4">
<section class="lg:col-span-2 bg-white rounded-xl shadow-sm border p-5">
  <div class="flex justify-between items-center border-b pb-3 mb-4"><div><h1 class="font-bold text-gray-800">Pembelanjaan Baru</h1><p class="text-xs text-gray-500">Barang yang disimpan di sini otomatis menambah stok.</p></div><span id="purchase-number" class="text-xs font-mono text-gray-500"></span></div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
    <input id="purchase-date" type="date" class="p-2 border rounded-lg text-sm">
    <input id="supplier-name" list="supplier-list" placeholder="Nama supplier" class="p-2 border rounded-lg text-sm">
    <datalist id="supplier-list"></datalist>
    <input id="supplier-contact" placeholder="Kontak supplier (opsional)" class="p-2 border rounded-lg text-sm">
    <input id="purchase-note" placeholder="Catatan / nomor nota (opsional)" class="p-2 border rounded-lg text-sm sm:col-span-2">
  </div>
  <div class="bg-gray-50 rounded-xl border p-3 mb-4">
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
      <div class="sm:col-span-5 relative"><input id="item-search" autocomplete="off" placeholder="Cari barang inventori..." class="w-full p-2 border rounded-lg text-sm"><div id="item-search-results" class="absolute z-[90] left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-lg hidden max-h-60 overflow-y-auto"></div></div>
      <input id="item-qty" type="number" min="1" step="1" value="1" class="sm:col-span-2 p-2 border rounded-lg text-sm" placeholder="Qty">
      <input id="item-price" type="number" min="0" step="1" class="sm:col-span-3 p-2 border rounded-lg text-sm" placeholder="Harga beli / unit">
      <button id="btn-add-item" class="sm:col-span-2 bg-slate-800 text-white rounded-lg font-bold text-sm">TAMBAH</button>
    </div>
  </div>
  <div id="purchase-items" class="space-y-2"></div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
    <input id="purchase-shipping" type="number" min="0" value="0" class="p-2 border rounded-lg text-sm" placeholder="Ongkir">
    <input id="purchase-other" type="number" min="0" value="0" class="p-2 border rounded-lg text-sm" placeholder="Biaya lain">
  </div>
  <div class="mt-4 p-4 bg-slate-50 rounded-xl border flex justify-between items-center"><span class="font-bold text-sm">TOTAL PEMBELIAN</span><strong id="purchase-total" class="text-xl">Rp 0</strong></div>
  <button id="btn-save-purchase" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold">SIMPAN PEMBELIAN & TAMBAH STOK</button>
</section>
<section class="bg-white rounded-xl shadow-sm border p-5">
  <div class="flex justify-between border-b pb-3 mb-3"><h2 class="font-bold text-gray-800">Riwayat Pembelanjaan</h2><button id="btn-refresh" class="text-xs text-blue-600 font-bold">REFRESH</button></div>
  <div id="purchase-history" class="space-y-2 max-h-[650px] overflow-y-auto"><div class="text-xs text-gray-400 italic">Memuat...</div></div>
</section>
</div></main></div>
<script src="js/firebase.js"></script><script src="js/inventory-ledger.js"></script><script src="js/purchasing.js"></script><script src="js/auth-session.js"></script><script src="js/app-shell.js"></script>
</body></html>
