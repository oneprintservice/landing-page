<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Tracking OnePrint</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap' rel='stylesheet'><script src='https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js'></script><style>body{font-family:Poppins,sans-serif;background:#f4f7fb;padding:20px}.card{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:20px}.search{display:flex;gap:10px}.search input{flex:1;padding:12px}.search button{padding:12px 20px}.timeline{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.step{padding:8px 12px;border-radius:999px;background:#eee}.done{background:#d1fae5}.current{background:#dbeafe}</style></head><body><div class='card'><h1>Tracking Servis OnePrint</h1><div class='search'><input id='tt'><button onclick='cari()'>CEK</button></div><div id='result' style='display:none'><h2 id='status'></h2><div id='timeline' class='timeline'></div><p><b>No TT:</b> <span id='nomor'></span></p><p><b>Pelanggan:</b> <span id='pelanggan'></span></p><p><b>Perangkat:</b> <span id='merk'></span></p><p><b>Keluhan:</b> <span id='keluhan'></span></p><p><b>Catatan:</b> <span id='ket'></span></p></div></div><script>const firebaseConfig={apiKey:'AIzaSyBcyS36JnJNGZPdSxd_g9UmCq4BJRiG2rA',authDomain:'oneprintservice-db.firebaseapp.com',databaseURL:'https://oneprintservice-db-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'oneprintservice-db'};firebase.initializeApp(firebaseConfig);const db=firebase.database();const steps=['MASUK','DIAGNOSA','MENUNGGU SPAREPART','DIKERJAKAN','SELESAI','DIAMBIL'];function maskNama(n){if(!n)return '-';let p=n.trim().split(' ');if(p.length===1)return p[0];let b=p.slice(1).join(' ');return p[0]+' '+b.substring(0,3)+'***';}function drawTimeline(s){let idx=steps.indexOf(s);let h='';steps.forEach((x,i)=>{let c='step';if(i<idx)c+=' done';if(i===idx)c+=' current';h+=`<div class='${c}'>${x}</div>`});document.getElementById('timeline').innerHTML=h;}async function cari(){let k=document.getElementById('tt').value.toUpperCase().replace('TT-','').replace('TT','').trim();let snap=await db.ref('servis/'+k).once('value');if(!snap.exists()){alert('Tidak ditemukan');return;}let d=snap.val();result.style.display='block';nomor.innerText='TT-'+d.nomor;status.innerText=d.status||'-';pelanggan.innerText=maskNama(d.pelanggan);merk.innerText=d.merk||'-';keluhan.innerText=d.keluhan||'-';ket.innerText=d.keterangan||'-';drawTimeline((d.status||'').toUpperCase());}const p=new URLSearchParams(location.search);if(p.get('tt')){tt.value=p.get('tt');cari();}</script></body></html>
