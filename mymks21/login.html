<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - KSP Manager</title>
<link rel="stylesheet" href="assets/css/lapangan.css"></head><body>
<main class="ksp-shell" style="min-height:100vh;display:grid;place-items:center">
<section class="ksp-card" style="width:min(420px,100%);padding:22px">
<div style="text-align:center;margin-bottom:18px"><div class="brand-mark" style="margin:auto">MKS</div><h1 style="margin:10px 0 3px">KSP Manager</h1><p style="color:#64748b;margin:0">Sistem Manajemen Koperasi</p></div>
<form id="loginForm" class="ksp-grid"><div class="ksp-field full"><label>Username</label><input id="username" required autocomplete="username"></div><div class="ksp-field full"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="ksp-field full"><label>Masuk sebagai</label><select id="role"><option value="lapangan">Petugas Lapangan</option><option value="admin">Admin</option></select></div><div class="ksp-field full"><button class="ksp-btn ksp-btn-primary" type="submit">Masuk</button></div></form>
<p style="font-size:11px;color:#94a3b8;text-align:center;margin:14px 0 0">Session tetap aktif sampai 05.00.</p></section></main>
<script src="assets/js/common.js"></script><script>
document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();const u=document.getElementById("username").value.trim();const p=document.getElementById("password").value;const role=document.getElementById("role").value;if(!u||!p){kspNotify("Username dan password wajib diisi.","warning");return}kspSession.save(role,u);kspNotify("Login berhasil.","success","Selamat datang");setTimeout(()=>location.href=role==="admin"?"admin/dashboard.html":"lapangan/dashboard.html",250)});
</script></body></html>
