<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pengajuan Kredit - KSP Manager</title><link rel="stylesheet" href="../assets/css/lapangan.css"></head><body>
<header class="app-header"><div class="header-inner"><div class="brand"><div class="brand-mark">MKS</div><div><h1 class="brand-title">KSP Manager</h1><p class="brand-subtitle">Petugas Lapangan</p></div></div></div></header>
<main class="ksp-shell"><div class="ksp-actions"><a class="ksp-btn ksp-btn-light" href="dashboard.html">← Dashboard</a><a class="ksp-btn ksp-btn-success" href="angsuran.html">💰 Angsuran</a></div>
<section class="ksp-card"><h3>Pilih Nasabah</h3><div class="ksp-search"><input id="customerSearch" placeholder="Nomor anggota, nama, atau NIK"><button id="customerSearchBtn" class="ksp-btn ksp-btn-primary">Cari</button></div><div id="customerResults" style="margin-top:10px"></div><div id="selected" style="margin-top:10px"></div></section>
<section class="ksp-card"><h3>Detail Pengajuan</h3><form id="form" class="ksp-grid"><div class="ksp-field"><label>Jumlah Pengajuan (ribu)</label><input id="jumlah" inputmode="numeric" placeholder="1200" required></div><div class="ksp-field"><label>Tenor</label><input id="tenor" type="number" min="1" max="60" required></div><div class="ksp-field full"><label>Model Jatuh Tempo</label><select id="model"><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div><div class="ksp-field full"><label>Tujuan</label><input id="tujuan" required></div><div class="ksp-field full"><label>Catatan</label><textarea id="catatan"></textarea></div><div class="ksp-field full"><button class="ksp-btn ksp-btn-success" type="submit">✓ Ajukan Kredit</button></div></form></section>
<section class="ksp-card"><h3>Daftar Pengajuan</h3><div class="ksp-search"><input id="filter" placeholder="Cari nomor anggota, nama, atau NIK"><button id="filterBtn" class="ksp-btn ksp-btn-primary">Cari</button></div><div class="ksp-table-wrap" style="margin-top:10px"><table class="ksp-table"><thead><tr><th>Tanggal</th><th>No. Anggota</th><th>Nasabah</th><th>NIK</th><th>Jumlah</th><th>Tenor</th><th>JT</th><th>Status Nasabah</th><th>Score</th><th>Status Pengajuan</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><nav class="ksp-bottom"><a href="dashboard.html">⌂<span>Dashboard</span></a><a href="cari-nasabah.html">👥<span>Cari</span></a><a class="active" href="pengajuan.html">📋<span>Pengajuan</span></a><a href="angsuran.html">💰<span>Angsuran</span></a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/common.js"></script>
<script src="pengajuan.js"></script><script>kspRequireRole(["admin","lapangan"]);kspStartSessionGuard();</script></body></html>
